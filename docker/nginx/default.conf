server {
    listen 80;
    server_name localhost;
    client_max_body_size 8m;

    # Toda la API pasa por el front controller PHP
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass php:9000;
    }

    location = /health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI /health;
        fastcgi_pass php:9000;
    }

    # Uploads estaticos: nunca ejecutar PHP en esta carpeta
    location /storage/uploads/ {
        alias /var/www/api/storage/uploads/;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        default_type text/plain;
        return 200 'IES Ramon Arcas — API en /api/v1 (ver README)\n';
    }
}
