components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ies_web_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string }
        db: { type: string }
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    EstadoEditorial:
      type: string
      enum: [borrador, publicado, archivado]
    Noticia:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        slug_en: { type: string, nullable: true }
        titulo_es: { type: string }
        titulo_en: { type: string, nullable: true }
        resumen_es: { type: string, nullable: true }
        resumen_en: { type: string, nullable: true }
        cuerpo_es: { type: string }
        cuerpo_en: { type: string, nullable: true }
        categoria: { type: string, nullable: true }
        imagen_id: { type: integer, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
        destacado: { type: boolean }
        curso_academico_id: { type: integer, nullable: true }
    NoticiaWrite:
      type: object
      properties:
        slug: { type: string }
        slug_en: { type: string }
        titulo_es: { type: string }
        titulo_en: { type: string }
        resumen_es: { type: string }
        resumen_en: { type: string }
        cuerpo_es: { type: string }
        cuerpo_en: { type: string }
        categoria: { type: string }
        imagen_id: { type: integer, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
        destacado: { type: boolean }
        curso_academico_id: { type: integer, nullable: true }
    PaginaBloque:
      type: object
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [texto, imagen, documentos, enlaces] }
        contenido: { type: object, additionalProperties: true }
        orden: { type: integer }
    Pagina:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        slug_en: { type: string, nullable: true }
        titulo_es: { type: string }
        titulo_en: { type: string, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
        bloques:
          type: array
          items: { $ref: '#/components/schemas/PaginaBloque' }
    PaginaWrite:
      type: object
      properties:
        slug: { type: string }
        slug_en: { type: string }
        titulo_es: { type: string }
        titulo_en: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
    PaginaBloquesPut:
      type: object
      required: [bloques]
      properties:
        bloques:
          type: array
          items:
            type: object
            required: [tipo]
            properties:
              tipo: { type: string, enum: [texto, imagen, documentos, enlaces] }
              contenido: { type: object, additionalProperties: true }
              orden: { type: integer }
    Documento:
      type: object
      properties:
        id: { type: integer }
        titulo_es: { type: string }
        titulo_en: { type: string, nullable: true }
        descripcion_es: { type: string, nullable: true }
        descripcion_en: { type: string, nullable: true }
        categoria_id: { type: integer }
        categoria_slug: { type: string }
        curso_academico_id: { type: integer, nullable: true }
        ensenanza_id: { type: integer, nullable: true }
        archivo_id: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
        url_descarga: { type: string }
    DocumentoWrite:
      type: object
      properties:
        titulo_es: { type: string }
        titulo_en: { type: string }
        descripcion_es: { type: string }
        descripcion_en: { type: string }
        categoria_id: { type: integer }
        curso_academico_id: { type: integer, nullable: true }
        ensenanza_id: { type: integer, nullable: true }
        archivo_id: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
    Programa:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        slug_en: { type: string, nullable: true }
        categoria: { type: string, enum: [educativo, plan_centro, actividad, otro] }
        titulo_es: { type: string }
        titulo_en: { type: string, nullable: true }
        descripcion_es: { type: string, nullable: true }
        descripcion_en: { type: string, nullable: true }
        documento_id: { type: integer, nullable: true }
        imagen_id: { type: integer, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
        orden: { type: integer }
        departamentos:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              slug: { type: string }
              nombre_es: { type: string }
              nombre_en: { type: string, nullable: true }
    ProgramaWrite:
      type: object
      properties:
        slug: { type: string }
        slug_en: { type: string }
        categoria: { type: string, enum: [educativo, plan_centro, actividad, otro] }
        titulo_es: { type: string }
        titulo_en: { type: string }
        descripcion_es: { type: string }
        descripcion_en: { type: string }
        documento_id: { type: integer, nullable: true }
        imagen_id: { type: integer, nullable: true }
        estado: { $ref: '#/components/schemas/EstadoEditorial' }
        publicado_en: { type: string, format: date-time, nullable: true }
        orden: { type: integer }
    ConfiguracionPublica:
      type: object
      additionalProperties: { type: string }
      description: Mapa clave→valor (p. ej. nombre_centro, intranet_url)
    ConfiguracionItem:
      type: object
      properties:
        clave: { type: string }
        valor: { type: string }
        publica: { type: boolean }
        updated_at: { type: string, format: date-time }
    ConfiguracionUpsert:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [clave, valor]
            properties:
              clave: { type: string }
              valor: { type: string }
              publica: { type: boolean }
    ContactoCreate:
      type: object
      required: [nombre, email, tipo, mensaje, consentimiento_privacidad]
      properties:
        nombre: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        tipo: { type: string, enum: [consulta, sugerencia, queja, rincon_pensar] }
        mensaje: { type: string, maxLength: 5000 }
        consentimiento_privacidad: { type: boolean }
    ContactoRecibo:
      type: object
      properties:
        id: { type: integer }
        recibido: { type: boolean }
    Contacto:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        email: { type: string }
        tipo: { type: string, enum: [consulta, sugerencia, queja, rincon_pensar] }
        mensaje: { type: string }
        consentimiento_privacidad: { type: boolean }
        estado: { type: string, enum: [pendiente, en_curso, finalizado] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactoEstadoPatch:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [pendiente, en_curso, finalizado] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Paginated:
      description: Colección paginada
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object }
              meta:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
